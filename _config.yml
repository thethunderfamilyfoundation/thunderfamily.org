title: Thunder Family Foundation
description: The Thunder Family Foundation raises funds to support Manual Middle School and its students.
url: ""
baseurl: ""
lang: en
markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - plan.md
  - vendor
  - .bundle
  - .github
  - assets/favicon/README.md
  - assets/favicon/favicon-*.png
  - assets/favicon/preview.png
  - "Thunder Family Foundation footer redesign.png"

collections:
  sections:
    output: false
  giving:
    output: false
  fundraisers:
    output: false

defaults:
  - scope:
      path: ""
      type: sections
    values:
      layout: null
  - scope:
      path: ""
      type: giving
    values:
      layout: null
  - scope:
      path: ""
      type: fundraisers
    values:
      layout: null
